# Copy to bridge.yaml (gitignored) and edit. One file describes every backend and the policy
# that applies to it; onboarding a system needs no code change.

bridge:
  # read-only | dry-run | read-write
  #
  # read-only  — the default, and the only mode that needs no further thought.
  # dry-run    — validates and returns the plan (parsed SQL, resolved tables) without
  #              touching the backend. Use this to audit the guardrails before granting
  #              anyone real access.
  # read-write — still refuses every write unless the target is on a `allow-write-*` list.
  #              Enabling this mode alone grants nothing. See docs/adr/003.
  mode: read-only

  # stdio | http. stdio is what an MCP client launches as a subprocess; http serves the
  # Streamable HTTP transport on /mcp for a shared deployment.
  transport: stdio

  # Applies only to transport: http. Ignored entirely under stdio, where the caller is the
  # process that launched this one and there is nothing to authenticate.
  http:
    endpoint: /mcp

    # Browser callers only. Left empty, no browser origin is accepted — an MCP endpoint on
    # localhost with no Origin check is reachable by any page the user happens to visit.
    allowed-origins: []
    allowed-hosts: []

    auth:
      # api-key | oauth2 | none
      mode: api-key

      keys:
        # `principal` is the identity in the audit log; `profile` picks the policy below.
        # Omit `profile` and the caller gets the datasource's own policy block.
        - key: ${ANALYST_KEY}
          principal: analytics-team
          profile: analyst
        - key: ${ONCALL_KEY}
          principal: oncall
        # Never commit a literal key. These resolve from the environment, and a key shorter
        # than 16 characters is refused at startup.

      # mode: oauth2 instead, for a deployment that already has an identity provider.
      #
      # oauth2:
      #   issuer-uri: https://login.example.com/
      #   # RFC 8707 resource indicator: the URI identifying THIS bridge. Required. Without
      #   # it, a token the same issuer minted for any other service would be accepted here.
      #   audience: https://bridge.internal/mcp
      #   principal-claim: sub
      #   profile-claim: bridge_profile
      #   required-scope: mcp.read

  audit:
    # Every call — allowed or denied — is written here as one JSON object per line, with the
    # rule that fired. Denials without a reason are useless; the reason is the point.
    file: audit.log

  datasources:
    - name: orders-db
      url: jdbc:postgresql://localhost:5432/orders
      username: ${DB_USER:bridge}
      password: ${DB_PASSWORD:bridge}
      policy:
        # Matched against table names resolved from the parsed SQL, never against the raw
        # query text. A table reached through a join or a view is checked the same way.
        allow-tables:
          - customers
          - orders
          - order_items
        # `internal_audit` is intentionally absent: the guardrail tests assert that a join
        # onto it is denied even though the rest of the query is legitimate.

        max-rows: 200            # hard cap; the tool description states it to the model
        max-result-bytes: 1MB    # stops a wide TEXT column blowing the context window
        statement-timeout: 5s    # applied on the connection, not just hoped for

        # Values are replaced with "[redacted]" before leaving the process. Patterns match
        # `table.column`, with `*` for any table.
        redact-columns:
          - "*.email"
          - "*.ssn"
          - "*_token"
          - "*.password*"

        # Uncomment ONLY with mode: read-write. There is no wildcard — `*` is rejected at
        # config load, deliberately.
        # allow-write-tables:
        #   - order_items

      # Per-principal policy. A key or a token claim names one of these; anyone who names
      # none gets the `policy` block above.
      #
      # Each profile lists only what it CHANGES. Everything unstated is inherited, so the
      # common case — "the same, but fewer tables" — is two lines, and there is no second
      # copy of the caps to keep in step with the first.
      #
      # A profile may only narrow. One that reads a table the datasource does not, runs
      # longer, returns more rows, or drops a redaction the datasource applies is rejected
      # at startup, naming the dimension that widened. That makes the block above a true
      # ceiling: reviewing what this database exposes means reading one list, and the tool
      # descriptions generated from it always overstate rather than understate the limits.
      profiles:
        analyst:
          allow-tables: [customers, orders]
          max-rows: 50
          # Added to the datasource's redactions, never instead of them.
          redact-columns: ["customers.country"]
        support:
          allow-tables: [orders]
          statement-timeout: 2s

  # An unconfigured backend registers no tools at all.
  brokers:
    - name: orders-kafka
      bootstrap-servers: localhost:9092
      # Kafka client settings for a real deployment go here verbatim — security.protocol,
      # sasl.jaas.config, truststore paths. The bridge's own timeouts are applied after
      # these, so they cannot be weakened from configuration.
      client: {}
      policy:
        # Wildcards are fine for reads; a topic family is how Kafka is usually organised.
        allow-topics: ["orders.*", "shipments.*"]
        max-messages: 50
        max-result-bytes: 512KB
        request-timeout: 10s

        # Header values replaced with "[redacted]". `key` and `value` are addressable as
        # pseudo-headers, so a topic carrying PII in the body can stay readable with the
        # payload withheld: "orders.events.value".
        redact-headers:
          - "*.authorization"
          - "*.x-api-key"

        # Uncomment ONLY with mode: read-write, and note there is no wildcard here — every
        # writable topic is named, and `*` is rejected at config load.
        #
        # This is what gates kafka.produce and kafka.reset_offsets. Both tools are always
        # registered; without both opt-ins they answer every call with a refusal that names
        # which gate stopped it, which is more useful to a model than a missing tool.
        # allow-write-topics:
        #   - orders.replay
